[project]
name = "office-rag"
version = "0.1.0"
description = "Research project: RAG over The Office (US) transcripts"
requires-python = ">=3.12"
dependencies = ["pandas", "pyarrow", "datasets", "psycopg[binary]", "tiktoken", "google-genai", "fastapi", "uvicorn", "bm25s"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["common", "ingest", "retrieval", "generation", "app"]
